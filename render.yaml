services:
  - type: web
    name: placement-backend-21ap
    runtime: docker
    rootDir: placement_backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
  - type: web
    name: dtu-student-placement-system-1
    runtime: static
    rootDir: placement_frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_BASE_URL
        value: https://placement-backend-21ap.onrender.com
    routes:
      - type: rewrite
        source: /announcements
        destination: /index.html
      - type: rewrite
        source: /*
        destination: /index.html
